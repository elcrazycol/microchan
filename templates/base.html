<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}microchan{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/main.js" defer></script>
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">microchan</a>
  <nav class="board-nav">
    {% for b in boards %}
    <a href="/{{ b.short }}/"{% if b.nsfw %} class="nsfw"{% endif %} title="{{ b.title }}">/{{ b.short }}/</a>
    {% endfor %}
  </nav>
  <form class="jump-form" action="/jump" method="get">
    <input type="number" name="n" min="1" placeholder="№ post">
    <button type="submit">Go</button>
  </form>
</header>
<main class="content">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <a href="/mod/">moderator</a>
</footer>
</body>
</html>
