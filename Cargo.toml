[package]
name = "microchan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hmac = "0.13.0"
image = { version = "0.25.10", features = ["jpeg", "png", "webp", "gif"] }
ipnet = { version = "2.12.1", features = ["serde"] }
mime_guess = "2.0.5"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace", "set-header", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webp = "0.3.1"
