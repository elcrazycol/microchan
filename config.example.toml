# Example microchan configuration.
# Copy to config.toml, edit the secrets, and run.

[server]
host = "127.0.0.1"
port = 8080
# Public URL (for correct links)
base_url = "http://localhost:8080"
# Directory for uploaded files
data_dir = "data"
# Trusted proxies (IP or CIDR) — their X-Forwarded-For is accepted
trusted_proxies = ["127.0.0.1/32"]

[database]
# IMPORTANT: set your PostgreSQL username (usually your OS user, see `whoami`).
# Without it SQLx 0.9 falls back to role "anonymous" and the connection fails.
url = "postgres://YOUR_USERNAME@localhost/microchan"

[security]
# Change me! Secret for HMAC-hashing IPs.
secret = "change-me-please"
# Optional separate salt for secure tripcodes (defaults to `secret`)
#secure_trip_salt = "change-me-too"
# Old secrets for rotation (still checked for bans)
old_secrets = []
# Max posts per IP hash per minute
max_posts_per_minute = 10
# HSTS (only when serving over HTTPS)
hsts = false

[moderation]
# Change me! Mod panel login password.
admin_password = "change-me-please"
# If set, the mod panel is available only at /mod/<secret>
mod_secret_url = ""
# Mod session lifetime, hours
session_hours = 12

[media]
thumb_width = 200
thumb_height = 200
thumb_quality = 80
# Max video duration in seconds (0 = unlimited)
max_video_seconds = 0
# Max image pixels (width × height), 0 = unlimited
max_image_pixels = 50000000

# Boards. Add/remove/edit only here.
[[boards]]
short = "b"
title = "Random"
description = "Everything and anything"
nsfw = false
thread_limit = 100
bump_limit = 500
max_images = 5
max_file_size = 10485760
allowed_extensions = ["jpg", "jpeg", "png", "webp", "gif", "webm", "mp4"]
# max_thread_age_days = 30

[[boards]]
short = "tech"
title = "Technology"
description = "Technology and code"
nsfw = false
thread_limit = 50
bump_limit = 300
max_images = 3
max_file_size = 10485760
allowed_extensions = ["jpg", "jpeg", "png", "webp", "gif", "webm", "mp4"]
